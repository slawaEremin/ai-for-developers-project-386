[project]
name = "calendar-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi", "uvicorn"]

[dependency-groups]
dev = ["datamodel-code-generator", "httpx", "pytest", "ruff"]

[tool.uv]
required-version = "==0.13.7"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
