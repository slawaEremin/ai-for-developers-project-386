services:
  db:
    profiles: [development]
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: calendar
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar
    ports:
      - "127.0.0.1:55431:5432"
    volumes:
      - calendar-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar -d calendar"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: ${PORT:-8000}
      OWNER_NAME: Владелец календаря
    volumes:
      - calendar-standalone-data:/app/data
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
volumes:
  calendar-data:
  calendar-standalone-data:
